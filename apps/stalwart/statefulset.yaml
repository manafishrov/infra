apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: manafishrov-stalwart
  annotations:
    configmap.reloader.stakater.com/reload: stalwart-config
    secret.reloader.stakater.com/reload: stalwart-env,stalwart-dkim,wildcard-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stalwart
  serviceName: stalwart-internal
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: stalwart
          image: ghcr.io/michaelbrusegard/stalwart-native-scim:sha-f5918b808ac9f481f63deeeb8a9c0a526faf57a5-670b02fc450a@sha256:ee91efd83fd1c4ab51d1462e7b0188546449093e7960ead09f4917c068dbbd2d
          command:
            - /usr/local/bin/stalwart
            - --config
            - /var/lib/stalwart/config.json
          env:
            - name: STALWART_PUBLIC_URL
              value: https://mail-admin.manafishrov.com
            - name: STALWART_OIDC_ADMIN_GROUP
              value: mail-admin
          envFrom:
            - secretRef:
                name: stalwart-env
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 443
              name: https
            - containerPort: 24
              name: edge-lmtp
            - containerPort: 25
              name: edge-smtp
            - containerPort: 26
              name: edge-smtp-local
            - containerPort: 465
              name: submissions
            - containerPort: 587
              name: submission
            - containerPort: 993
              name: imaps
            - containerPort: 4190
              name: sieve
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS --max-time 3 http://127.0.0.1:8080/healthz/ready >/dev/null
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
            - mountPath: /var/lib/stalwart/config.json
              name: config
              subPath: config.json
              readOnly: true
            - mountPath: /var/lib/stalwart/private/tls
              name: tls
              readOnly: true
            - mountPath: /var/lib/stalwart/private/dkim
              name: dkim
              readOnly: true
            - mountPath: /tmp
              name: temp
      volumes:
        - name: temp
          emptyDir: {}
        - name: config
          configMap:
            name: stalwart-config
        - name: tls
          secret:
            secretName: wildcard-tls
        - name: dkim
          secret:
            secretName: stalwart-dkim
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: ssd-ha
