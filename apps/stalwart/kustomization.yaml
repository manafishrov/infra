apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Do not include backup.yaml while manata is disconnected. VolSync starts the
  # initial synchronization setup even when a new ReplicationSource is paused.
  - statefulset.yaml
  - services.yaml
  - httproute.yaml
  - network-policy.yaml
  - config.yaml
  - entrypoint.yaml
  - plan.yaml
  - reconciler.yaml
