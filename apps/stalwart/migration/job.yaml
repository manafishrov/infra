# Manual operation only. Suspend reconciliation and stop stalwart-0 first.
# RWO scheduling relies on the StatefulSet remaining at zero until completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-migrate-v1
  namespace: manafishrov-stalwart
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: stalwart-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/stalwartlabs/stalwart-migrate:1.0.6-oss@sha256:36cca5dc067722cef2ee5d35479e8d9be1b39909176900db04f2f106e54dece4
          workingDir: /var/lib/stalwart
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              state=/var/lib/stalwart/migration-v1
              mkdir -p "$state"
              # Preserve recorded/edited answers and migration progress on retry.
              if [ ! -f "$state/answers.toml" ]; then
                cp /migration/answers.toml "$state/answers.toml"
              fi
              stalwart-migrate prepare --non-interactive \
                --source /migration/source.json --state "$state"
              # Never bypass errors, mass-removal guards or final-run guards.
              result=0
              stalwart-migrate run --final --yes --verify-full --concurrency 2 \
                --source /migration/source.json --target /migration/target.json \
                --state "$state" || result=$?
              if [ "$result" -eq 0 ]; then
                stalwart-migrate verify --full --concurrency 2 \
                  --source /migration/source.json --target /migration/target.json \
                  --state "$state" || result=$?
              fi
              stalwart-migrate status --state "$state"
              stalwart-migrate report --state "$state" --format json > "$state/final-report.json"
              stalwart-migrate report --state "$state" --severity error
              exit "$result"
          envFrom:
            - secretRef:
                name: stalwart-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/stalwart
            - name: config
              mountPath: /migration
              readOnly: true
            - name: tls
              mountPath: /var/lib/stalwart/private/tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-stalwart-0
        - name: config
          configMap:
            name: stalwart-migration
        - name: tls
          secret:
            secretName: wildcard-tls
