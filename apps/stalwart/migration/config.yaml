# Manual operation only. Source and target must remain separate on the PVC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-migration
  namespace: manafishrov-stalwart
data:
  source.json: |
    {"@type":"RocksDb","path":"/var/lib/stalwart/data/"}
  target.json: |
    {"@type":"RocksDb","path":"/var/lib/stalwart/data-v1/"}
  answers.toml: |
    version = 1

    # Copy all categories, including final-only queue/tasks and spam models.
    [global.categories]
    include = ["settings", "principals", "mail", "calendars", "contacts", "files", "sieve", "identities", "push_subscriptions", "spam_samples", "reports", "archive", "spam_model", "queue", "tasks", "telemetry"]

    # Isolated rollback: copy any external blobs too (normally all are RocksDB).
    [global.blob_store]
    mode = "copy"

    [instance.oidc_directory."x:Directory/jdzlxs2sajaa"]
    accepted_audiences = ["stalwart"]
    skip_audience_validation = false
    opaque_token_validation = "userInfo"
    # Preserve existing Pocket ID WebUI administration; native roles still apply.
    unscoped_tokens = "full"
    allow_id_token_claims = false
    lenient_issuer_match = false
    allow_invalid_certs = false
    claim_name = "name"

    [instance.oauth_registration."x:OidcProvider"]
    action = "accept"

    [instance.oidc_token_lifetimes."x:OidcProvider"]
    action = "clamp"

    # Only asked when the OLD useXForwarded is true. With today's false, the
    # converter writes peer instead; Tofu must set XFF before reopening traffic.
    [instance.http_forwarded."x:Http"]
    source = "xForwardedFor"
    hops = 1

    [global.oauth_client_scopes]
    scopes = "interoperable"

    [global.enterprise_on_oss]
    action = "drop"

    [global.new_permissions]
    action = "grant"

    [global.encryption_at_rest]
    header_protection = "none"

    [global.changed_defaults]
    policy = "pin"
