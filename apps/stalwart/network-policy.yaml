apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stalwart
  namespace: manafishrov-stalwart
spec:
  endpointSelector:
    matchLabels:
      app: stalwart
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "993"
              protocol: TCP
            - port: "4190"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: stalwart-edge
            k8s:app: stalwart-edge
      toPorts:
        - ports:
            - port: "24"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "993"
              protocol: TCP
    - fromCIDR:
        - 10.0.186.0/24
        - fd7a:115c:a1e0:186::/64
        - 10.0.187.0/24
        - fd7a:115c:a1e0:187::/64
        - 100.102.0.0/16
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "4190"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: manafishrov-nextcloud
            k8s:app: nextcloud
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: manafishrov-roundcube
            k8s:app: roundcube
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: manafishrov-pocket-id
            k8s:app: pocket-id
      toPorts:
        - ports:
            - port: "465"
              protocol: TCP
            - port: "993"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
            k8s:app: uptime-kuma
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "993"
              protocol: TCP
            - port: "4190"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "465"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
