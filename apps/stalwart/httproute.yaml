apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-internal
  namespace: manafishrov-stalwart
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - stalwart.manafishrov.com
  rules:
    - backendRefs:
        - name: stalwart-internal
          port: 8080
