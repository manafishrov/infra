apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-plan
  namespace: manafishrov-stalwart
data:
  # CLI v1.0.7 destroys first, then creates/updates in plan order. Keep referenced
  # objects in lexically earlier files so plan aliases resolve deterministically.
  00-listeners.ndjson.tmpl: |
    {"@type":"create","object":"NetworkListener","value":{"edge-lmtp":{"name":"edge-lmtp","protocol":"lmtp","bind":{"[::]:24":true},"useTls":true,"tlsImplicit":true},"submissions":{"name":"submissions","protocol":"smtp","bind":{"[::]:465":true},"useTls":true,"tlsImplicit":true},"submission":{"name":"submission","protocol":"smtp","bind":{"[::]:587":true},"useTls":true,"tlsImplicit":false},"imaps":{"name":"imaps","protocol":"imap","bind":{"[::]:993":true},"useTls":true,"tlsImplicit":true},"sieve":{"name":"sieve","protocol":"manageSieve","bind":{"[::]:4190":true},"useTls":true,"tlsImplicit":false},"http":{"name":"http","protocol":"http","bind":{"[::]:8080":true},"useTls":false,"tlsImplicit":false},"https":{"name":"https","protocol":"http","bind":{"[::]:443":true},"useTls":true,"tlsImplicit":true}}}

  10-certificate.ndjson.tmpl: |
    {"@type":"create","object":"Certificate","value":{"cert-wildcard":{"certificate":{"@type":"File","filePath":"/var/lib/stalwart/private/tls/tls.crt"},"privateKey":{"@type":"File","filePath":"/var/lib/stalwart/private/tls/tls.key"}}}}

  15-directory-pocket-id.ndjson.tmpl: |
    {"@type":"create","object":"Directory","value":{"dir-pocket-manafishrov":{"@type":"Oidc","description":"Pocket ID for manafishrov.com (dormant until mailbox adoption and explicit authentication activation)","issuerUrl":"https://id.manafishrov.com","requireScopes":{"openid":true,"email":true},"requireAudience":"stalwart","claimUsername":"email","claimName":"name","usernameDomain":"manafishrov.com"}}}

  # Keep bootstrap identities outside the domain managed by Pocket ID SCIM.
  18-system-domain.ndjson.tmpl: |
    {"@type":"create","object":"Domain","value":{"d-system":{"name":"system.manafishrov.com","allowScimProvisioning":false,"certificateManagement":{"@type":"Manual"},"dkimManagement":{"@type":"Manual"},"dnsManagement":{"@type":"Manual"},"allowRelaying":false,"isEnabled":true,"directoryId":null,"catchAllAddress":null}}}

  20-domain.ndjson.tmpl: |
    {"@type":"create","object":"Domain","value":{"d-manafishrov":{"name":"manafishrov.com","allowScimProvisioning":false,"aliases":{},"certificateManagement":{"@type":"Manual"},"dkimManagement":{"@type":"Manual"},"dnsManagement":{"@type":"Manual"},"subAddressing":{"@type":"Enabled"},"reportAddressUri":"mailto:postmaster@manafishrov.com","allowRelaying":false,"isEnabled":true,"directoryId":null,"memberTenantId":null,"catchAllAddress":null,"description":null,"logo":null}}}

  25-system-identity.ndjson.tmpl: |
    {"@type":"update","object":"SystemSettings","value":{"defaultHostname":"mail.manafishrov.com","defaultDomainId":"#d-manafishrov","defaultCertificateId":"#cert-wildcard"}}

  30-dkim.ndjson.tmpl: |
    {"@type":"create","object":"DkimSignature","value":{"dkim-rsa-mf":{"@type":"Dkim1RsaSha256","domainId":"#d-manafishrov","selector":"stalwart-rsa","privateKey":{"@type":"File","filePath":"/var/lib/stalwart/private/dkim/manafishrov.com.rsa.key"}},"dkim-ed25519-mf":{"@type":"Dkim1Ed25519Sha256","domainId":"#d-manafishrov","selector":"stalwart-ed25519","privateKey":{"@type":"File","filePath":"/var/lib/stalwart/private/dkim/manafishrov.com.ed25519.key"}}}}

  40-system-accounts.ndjson.tmpl: |
    {"@type":"create","object":"Account","value":{"admin":{"@type":"User","name":${ADMIN_LOCAL_JSON},"domainId":"#d-system","credentials":{"0":{"@type":"Password","secret":${ADMIN_PASSWORD_JSON}}},"memberGroupIds":{},"roles":{"@type":"Admin"},"permissions":{"@type":"Inherit"},"quotas":{},"aliases":{},"encryptionAtRest":{"@type":"Disabled"}},"mail-master":{"@type":"User","name":"mail-master","domainId":"#d-system","credentials":{"0":{"@type":"Password","secret":${MAIL_MASTER_PASSWORD_JSON}}},"memberGroupIds":{},"roles":{"@type":"User"},"permissions":{"@type":"Replace","enabledPermissions":{"authenticate":true,"impersonate":true}},"quotas":{},"aliases":{},"encryptionAtRest":{"@type":"Disabled"}},"scim":{"@type":"User","name":"scim","domainId":"#d-system","credentials":{},"memberGroupIds":{},"roles":{"@type":"User"},"permissions":{"@type":"Replace","enabledPermissions":{"authenticate":true,"scimAccess":true,"sysAccountGet":true,"sysAccountCreate":true,"sysAccountUpdate":true,"sysAccountDestroy":true}},"quotas":{},"aliases":{},"encryptionAtRest":{"@type":"Disabled"}}}}

  # A distribution list stays outside SCIM Users/Groups and targets the shared mailbox.
  45-postmaster.ndjson.tmpl: |
    {"@type":"create","object":"MailingList","value":{"postmaster":{"name":"postmaster","domainId":"#d-manafishrov","recipients":{"support@manafishrov.com":true}}}}

  60-route-resend.ndjson.tmpl: |
    {"@type":"create","object":"MtaRoute","value":{"mx":{"@type":"Relay","name":"mx","address":"smtp.resend.com","port":465,"protocol":"smtp","authUsername":"resend","authSecret":{"@type":"Value","secret":${RESEND_API_KEY_JSON}},"implicitTls":true,"allowInvalidCerts":false,"description":"Resend smarthost for external Manafish mail"}}}

  # The edge already authenticated and filtered Internet mail. Repeating these
  # checks on LMTP would incorrectly treat the edge pod as the remote sender.
  70-trusted-edge-delivery.ndjson.tmpl: |
    {"@type":"update","object":"SenderAuth","value":{"dkimVerify":{"match":{"0":{"if":"listener == 'edge-lmtp'","then":"disable"}},"else":"relaxed"},"spfEhloVerify":{"match":{"0":{"if":"local_port == 25","then":"relaxed"}},"else":"disable"},"spfFromVerify":{"match":{"0":{"if":"local_port == 25","then":"relaxed"}},"else":"disable"},"dmarcVerify":{"match":{"0":{"if":"local_port == 25","then":"relaxed"}},"else":"disable"},"reverseIpVerify":{"match":{"0":{"if":"local_port == 25","then":"relaxed"}},"else":"disable"}}}
    {"@type":"update","object":"MtaStageData","value":{"enableSpamFilter":{"match":{"0":{"if":"listener == 'edge-lmtp'","then":"false"}},"else":"is_empty(authenticated_as)"}}}

  80-mta-sts.ndjson.tmpl: |
    {"@type":"update","object":"MtaSts","value":{"mode":"testing","maxAge":604800000,"mxHosts":{}}}

  85-imap.ndjson.tmpl: |
    {"@type":"update","object":"Imap","value":{"maxAuthFailures":30}}

  90-tracer-stdout.ndjson.tmpl: |
    {"@type":"create","object":"Tracer","value":{"stdout":{"@type":"Stdout","enable":true,"level":"info","ansi":false,"buffered":false,"eventsPolicy":"exclude","events":{}}}}
