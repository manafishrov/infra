apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manafishrov-stalwart-backup
  namespace: flux-system
spec:
  # Keep the backup definition reconciled without creating a ReplicationSource
  # until manata is online and its repository has been initialized.
  suspend: true
  interval: 10m
  timeout: 5m
  path: ./apps/stalwart/backup
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: manafishrov
  serviceAccountName: manafishrov
