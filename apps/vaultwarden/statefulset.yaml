apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vaultwarden
  namespace: manafishrov-vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  serviceName: vaultwarden-internal
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
          env:
            - name: DOMAIN
              value: https://vault.manafishrov.com
            - name: ROCKET_PORT
              value: "8080"
            # SSO_ONLY blocks password login but not password registration,
            # so accounts must come from Pocket ID alone. Organizations can
            # still invite users who have already signed in through it.
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "true"
            - name: SSO_AUTHORITY
              value: https://id.manafishrov.com
            - name: SSO_PKCE
              value: "true"
            - name: SSO_SCOPES
              value: openid email profile
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: "true"
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: "false"
            - name: PASSWORD_HINTS_ALLOWED
              value: "false"
            - name: SHOW_PASSWORD_HINT
              value: "false"
            - name: TZ
              value: Europe/Oslo
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: manafishrov-pocket-id-outputs
                  key: manafishrov_vaultwarden_pocketid_client_id
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: manafishrov-pocket-id-outputs
                  key: manafishrov_vaultwarden_pocketid_client_secret
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            failureThreshold: 18
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: nvme-ha
