apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vaultwarden
  namespace: manafishrov-vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  serviceName: vaultwarden-internal
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
          env:
            - name: DOMAIN
              value: https://vault.manafishrov.com
            # SSO_ONLY blocks password login but not password registration,
            # so accounts must come from Pocket ID alone. Organizations can
            # still invite users who have already signed in through it.
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "true"
            - name: SSO_AUTHORITY
              value: https://id.manafishrov.com
            - name: SSO_PKCE
              value: "true"
            - name: SSO_SCOPES
              value: openid email profile
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: "true"
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: "false"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-env
                  key: ADMIN_TOKEN
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: manafishrov-pocket-id-outputs
                  key: manafishrov_vaultwarden_pocketid_client_id
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: manafishrov-pocket-id-outputs
                  key: manafishrov_vaultwarden_pocketid_client_secret
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            failureThreshold: 18
          volumeMounts:
            - mountPath: /data
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: nvme-ha
