name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-26.04
    outputs:
      tofu-stacks: ${{ steps.list-tofu.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list-tofu
        run: |
          stacks=$(printf '%s\n' tofu/*/ | xargs -n1 basename | sort | jq -R . | jq -sc .)
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  validate-kubernetes:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Install Tools
        run: nix profile install nixpkgs#kustomize nixpkgs#kubeconform
      - name: Validate Kubernetes Manifests
        run: |
          kustomize build . | \
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -verbose

  validate-tofu:
    needs: discover
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.tofu-stacks) }}
    env:
      OPENTOFU_VERSION: 1.11.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      - name: Install Stalwart provider mirror
        if: matrix.stack == 'stalwart'
        run: |
          image=ghcr.io/michaelbrusegard/terraform-provider-stalwart:1.0.3@sha256:4832706a856de04f0af6a1a7b4aee5277f74eab0285f089b3c585de3cf7dd1aa
          mirror="$RUNNER_TEMP/provider-mirror"
          mkdir -p "$mirror"
          container=$(docker create --platform linux/amd64 "$image" /bin/true)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/provider-mirror/." "$mirror/"
          cat > "$RUNNER_TEMP/tofurc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$RUNNER_TEMP/provider-mirror"
              include = ["registry.opentofu.org/michaelbrusegard/stalwart"]
            }
            direct {
              exclude = ["registry.opentofu.org/michaelbrusegard/stalwart"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/tofurc" >> "$GITHUB_ENV"
      - name: Check OpenTofu formatting
        run: tofu -chdir=tofu/${{ matrix.stack }} fmt -check
      - name: Initialize OpenTofu
        run: tofu -chdir=tofu/${{ matrix.stack }} init -backend=false
      - name: Validate OpenTofu
        run: tofu -chdir=tofu/${{ matrix.stack }} validate

  ci:
    name: ci
    if: always()
    needs:
      - discover
      - validate-kubernetes
      - validate-tofu
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          KUBERNETES_RESULT: ${{ needs.validate-kubernetes.result }}
          TOFU_RESULT: ${{ needs.validate-tofu.result }}
        run: |
          test "$DISCOVER_RESULT" = success
          test "$KUBERNETES_RESULT" = success
          test "$TOFU_RESULT" = success
