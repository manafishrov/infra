name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      tofu-stacks: ${{ steps.list-tofu.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list-tofu
        run: |
          stacks=$(printf '%s\n' tofu/*/ | xargs -n1 basename | sort | jq -R . | jq -sc .)
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  validate-kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Install Tools
        run: nix profile install nixpkgs#kustomize nixpkgs#kubeconform
      - name: Validate Kubernetes Manifests
        run: |
          kustomize build . | \
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -verbose

  validate-tofu:
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.tofu-stacks) }}
    env:
      OPENTOFU_VERSION: 1.11.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      - name: Install Stalwart provider mirror
        if: matrix.stack == 'stalwart'
        run: |
          version=0.2.3
          archive="terraform-provider-stalwart_${version}_linux_amd64.zip"
          mirror="$RUNNER_TEMP/provider-mirror/registry.opentofu.org/tahacodes/stalwart/${version}/linux_amd64"
          curl -fsSL "https://github.com/tahacodes/terraform-provider-stalwart/releases/download/v${version}/${archive}" -o "$RUNNER_TEMP/$archive"
          echo "9b4b3dc07a73055d7116fc426c6009de86479df7776ab23b6795132eeca8c119  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$mirror"
          unzip -q "$RUNNER_TEMP/$archive" -d "$mirror"
          cat > "$RUNNER_TEMP/tofurc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$RUNNER_TEMP/provider-mirror"
              include = ["registry.opentofu.org/tahacodes/stalwart"]
            }
            direct {
              exclude = ["registry.opentofu.org/tahacodes/stalwart"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/tofurc" >> "$GITHUB_ENV"
      - name: Check OpenTofu formatting
        run: tofu -chdir=tofu/${{ matrix.stack }} fmt -check
      - name: Initialize OpenTofu
        run: tofu -chdir=tofu/${{ matrix.stack }} init -backend=false
      - name: Validate OpenTofu
        run: tofu -chdir=tofu/${{ matrix.stack }} validate

  ci:
    name: ci
    if: always()
    needs:
      - discover
      - validate-kubernetes
      - validate-tofu
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          KUBERNETES_RESULT: ${{ needs.validate-kubernetes.result }}
          TOFU_RESULT: ${{ needs.validate-tofu.result }}
        run: |
          test "$DISCOVER_RESULT" = success
          test "$KUBERNETES_RESULT" = success
          test "$TOFU_RESULT" = success
